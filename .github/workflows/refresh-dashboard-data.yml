name: Refresh Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 1 * *"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest raw data
        run: python fetch_singstat_api.py

      - name: Transform raw data
        run: python transform_data.py

      - name: Export frontend payloads
        run: python export_frontend_data.py --quiet

      - name: Commit updated artifacts
        run: |
          if [ -z "$(git status --porcelain -- data frontend/public/projects/singapore-economic-stress-monitor/data)" ]; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data frontend/public/projects/singapore-economic-stress-monitor/data
          git commit -m "chore(data): refresh stress monitor payloads"
          git push
